<style type="text/css">
  body { background-color: #fcfcfc; font-family: Arial, Helvetica, sans-serif; margin: 20px; }
  .cmr-toolbox { max-width: 860px; margin: 0 auto 15px; text-align: center; }
  .cmr-toolbox p { color: #555; font-size: 13px; margin: 6px 0; }
  .cmr-page {
    position: relative;
    width: 840px;  /* 210mm at 4px/mm */
    height: 1212px; /* slightly taller than A4 so no box clips text */
    background: #fff;
    border: 1px solid #ccc;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    overflow: hidden;
    transform-origin: top left;
  }
  #cmrwrap { margin: 0 auto; overflow: visible; }
  #cmrwrap.scaled .cmr-page { border: 0; }
  .lbl20row { font-size: 5.5px; line-height: 1.1; white-space: normal !important; width: 142px; }
  .inp20cell { font-size: 8px; padding: 0 1px; }
  .btn {
    display: inline-block; padding: 5px 12px; margin: 0 3px;
    font-size: 13px; line-height: 1.4; text-align: center; cursor: pointer;
    color: #333; background-color: #fff; border: 1px solid #ccc;
    border-radius: 4px; vertical-align: middle; font-family: Arial, Helvetica, sans-serif;
  }
  .btn:hover { background-color: #e6e6e6; }
  .btn-large { padding: 9px 18px; font-size: 15px; }
  .btn-primary { color: #fff; background-color: #337ab7; border-color: #2e6da4; }
  .btn-primary:hover { background-color: #286090; }
  .cmr-fitbtn.active { background: #337ab7; color: #fff; }
  .box { position: absolute; border: 0.5px solid #ED1748; box-sizing: border-box; }
  .box.fat { border-width: 2.4px; }
  .lbl { position: absolute; color: #ED1748; font-size: 8px; line-height: 1.15; white-space: nowrap; overflow: visible; }
  .lbl b { font-size: 8px; }
  .num { position: absolute; color: #ED1748; font-weight: bold; font-size: 18px; line-height: 1; }
  .inp, .cmr-page textarea {
    position: absolute;
    border: 1px solid #b8c4d0; background: #fdfefe;
    font-size: 11px; color: #000;
    padding: 0 2px; margin: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }
  .inp:focus, .cmr-page textarea:focus { outline: 1px solid #4a90d9; background: #f2f8ff; border-color: #4a90d9; }
  .cmr-page textarea { resize: none; overflow: hidden; }
  .vnote { position: absolute; color: #ED1748; font-size: 6px; transform: rotate(-90deg); transform-origin: left top; white-space: nowrap; }
  .main-rect { position: absolute; border: 0.5px solid #ED1748; box-sizing: border-box; }
</style>
</head>

<script>
/* Fill every data-dict label from the shared dictionary (single source of truth). */
function cmrRenderLabels() {
    var esc = function (s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    };
    var nodes = document.querySelectorAll("[data-dict]");
    for (var i = 0; i < nodes.length; i++) {
        var key = nodes[i].getAttribute("data-dict");
        var strings = CMR_DICT.labels[key];
        if (!strings) continue;
        nodes[i].innerHTML = strings.map(esc).join("<br>");
    }
    var joins = document.querySelectorAll("[data-dict-join]");
    for (var k = 0; k < joins.length; k++) {
        var jk = joins[k].getAttribute("data-dict-join");
        if (jk.indexOf("copy") === 0) {
            var cp = CMR_DICT.copies[parseInt(jk.slice(4), 10)].labels;
            joins[k].innerHTML = esc(cp.join(" / "));
        } else {
            var jsr = CMR_DICT.labels[jk];
            if (jsr) joins[k].innerHTML = esc(jsr.join(" "));
        }
    }
    var lines = document.querySelectorAll("[data-dict-line]");
    for (var j = 0; j < lines.length; j++) {
        var spec = lines[j].getAttribute("data-dict-line").split(",");
        var src;
        if (spec[0].indexOf("copy") === 0) src = CMR_DICT.copies[parseInt(spec[0].slice(4), 10)].labels;
        else src = CMR_DICT.labels[spec[0]];
        var idx = parseInt(spec[1], 10);
        if (src && src[idx] !== undefined) lines[j].innerHTML = esc(src[idx]);
    }
}

/* Export: load the PDF engine pieces on first use, then generate. */
var cmrExportReady = false;
function cmrExportPDF() {
    if (cmrExportReady) { generatePDF(); return; }
    var pending = 0;
    function done() {
        if (--pending === 0) {
            if (!window.jsPDF && window.jspdf) window.jsPDF = window.jspdf.jsPDF;
            cmrExportReady = true;
            generatePDF();
        }
    }
    ["/cmr_files/jspdf.umd.min.js", "/cmr_files/dejavu-font.js", "/cmr_files/basic.js"].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src;
        pending++;
        s.onload = done;
        s.onerror = done;
        document.head.appendChild(s);
    });
}

var cmrFitMode = "width";
function cmrApplyFit() {
    var page = document.getElementById("cmrpage");
    var wrap = document.getElementById("cmrwrap");
    var s;
    if (cmrFitMode === "width") {
        s = (window.innerWidth - 40) / 840;
    } else {
        s = (window.innerHeight - 170) / 1212;
    }
    s = Math.max(s, 0.25);
    page.style.transform = "scale(" + s + ")";
    wrap.style.width = (840 * s) + "px";
    wrap.style.height = (1212 * s) + "px";
}
function cmrSetFit(mode) {
    cmrFitMode = mode;
    var w = document.getElementById("fitWidthBtn");
    var h = document.getElementById("fitHeightBtn");
    w.className = "btn cmr-fitbtn" + (mode === "width" ? " active" : "");
    h.className = "btn cmr-fitbtn" + (mode === "height" ? " active" : "");
    cmrApplyFit();
}
jQuery(function () {
    cmrRenderLabels();
    cmrApplyFit();
});
jQuery(window).on("resize", cmrApplyFit);
jQuery(function () {
    jQuery("#datepicker").datepicker({ changeMonth: true, changeYear: true, dateFormat: "dd/mm/yy" });
    jQuery("#datepicker2").datepicker({ changeMonth: true, changeYear: true, dateFormat: "yy.mm.dd" });
    jQuery("#24date").datepicker({ changeMonth: true, changeYear: true, dateFormat: "yy.mm.dd" });
});
</script>
